<title>Faceted globe highlighting Germany and Brazil</title>
<style>
  .globe-arc-tracer{
    stroke-dasharray: 100;
    stroke-dashoffset: 100;            /* start hidden */
    animation: globe-arc-draw 3.4s ease-in-out infinite;
  }
  @keyframes globe-arc-draw{
    0%   { stroke-dashoffset: 100; opacity: .95; }  /* nothing drawn */
    60%  { stroke-dashoffset: 0;   opacity: .95; }  /* fully drawn (DE -> BR) */
    80%  { stroke-dashoffset: 0;   opacity: .95; }  /* hold at BR */
    99%  { stroke-dashoffset: 0;   opacity: 0;   }  /* fade the drawn arc out */
    100% { stroke-dashoffset: 100; opacity: 0;   }  /* reset while invisible */
  }
  @media (prefers-reduced-motion: reduce){
    .globe-arc-tracer{ animation: none; stroke-dashoffset: 0; }
  }
</style>
